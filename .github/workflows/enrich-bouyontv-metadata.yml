name: Enrich BouyonTV metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout BouyonTV
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enrich existing verified catalogue
        run: python scripts/enrich_metadata.py

      - name: Validate enriched catalogue
        run: |
          test -s data/catalog.json
          python - <<'PY'
          import json
          d=json.load(open('data/catalog.json', encoding='utf-8'))
          channels=d.get('channels', [])
          assert channels, 'No channels in catalogue'
          assert d.get('count') == len(channels), 'Channel count mismatch'
          assert d.get('healthyUrls', 0) > 0, 'Healthy URL count missing'
          coverage=d.get('metadataCoverage', {})
          print(f"Verified channels: {len(channels)}")
          print(f"Country metadata: {coverage.get('country', 0)}/{len(channels)}")
          print(f"Language metadata: {coverage.get('language', 0)}/{len(channels)}")
          print(f"Category metadata: {coverage.get('category', 0)}/{len(channels)}")
          PY

      - name: Commit enriched catalogue
        run: |
          git config user.name 'bouyontv-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json
          git diff --cached --quiet || git commit -m 'chore: enrich BouyonTV metadata'
          git push origin HEAD:main

      - name: Verify repository catalogue
        run: |
          git fetch origin main
          git checkout --detach origin/main
          test -s data/catalog.json
          python - <<'PY'
          import json
          d=json.load(open('data/catalog.json', encoding='utf-8'))
          assert d.get('channels') and d.get('count') == len(d['channels'])
          print(f"Repository catalogue verified: {d['count']} channels")
          print('Metadata coverage:', d.get('metadataCoverage', {}))
          PY
