name: Merge CricHD Playlists

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Download and Merge M3U
        env:
          CRICHD1_URL: ${{ secrets.CRICHD1_URL }}
          CRICHD2_URL: ${{ secrets.CRICHD2_URL }}
        shell: python
        run: |
          import os
          import re
          import requests

          url1 = os.environ.get("CRICHD1_URL")
          url2 = os.environ.get("CRICHD2_URL")

          if not url1:
              raise RuntimeError("CRICHD1_URL secret is missing")
          if not url2:
              raise RuntimeError("CRICHD2_URL secret is missing")

          def fetch_m3u(url, name):
              print(f"Downloading {name}...")
              response = requests.get(
                  url,
                  timeout=60,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              response.raise_for_status()
              lines = response.text.strip().splitlines()
              if not lines:
                  raise RuntimeError(f"{name} returned an empty playlist")
              print(f"{name}: {len(lines)} lines")
              return lines

          def change_group_title(lines, title):
              result = []
              for line in lines:
                  if line.startswith("#EXTINF:"):
                      if 'group-title="' in line:
                          line = re.sub(
                              r'group-title="[^"]*"',
                              f'group-title="{title}"',
                              line
                          )
                      else:
                          line = line.replace(",", f' group-title="{title}",', 1)
                  result.append(line)
              return result

          m3u1 = change_group_title(fetch_m3u(url1, "CRICHD1_URL"), "CricHD 1")
          m3u2 = change_group_title(fetch_m3u(url2, "CRICHD2_URL"), "CricHD 2")

          merged = ["#EXTM3U"]
          merged.extend(m3u1[1:] if m3u1 and m3u1[0].strip().upper().startswith("#EXTM3U") else m3u1)
          merged.extend(m3u2[1:] if m3u2 and m3u2[0].strip().upper().startswith("#EXTM3U") else m3u2)

          with open("CricHD.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(merged) + "\n")

          print(f"Created CricHD.m3u with {len(merged)} lines")

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CricHD.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-merge CricHD playlists"
          git pull --rebase origin main
          git push origin main
