name: Update TVPass Playlist

# TVPass's original playlist endpoint is no longer available.
# Keep this workflow available for manual use if a verified replacement
# endpoint is added later, but do not run it automatically.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run tvpass.py
        run: python file/tvpass.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TVPass.m3u
          if ! git diff --cached --quiet; then
            git commit -m "auto-update TVPass.m3u"
            git push origin main
          else
            echo "No changes to commit"
          fi
