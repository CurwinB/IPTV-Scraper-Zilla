name: Update BouyonTV catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

env:
  CATALOG: data/catalog.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BouyonTV
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --upgrade requests

      - name: Build validated catalogue
        run: python scripts/build_catalog.py

      - name: Validate generated catalogue
        run: |
          set -euo pipefail
          test -s "$CATALOG"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/catalog.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          channels=d.get('channels')
          if not isinstance(channels,list) or not channels:
              raise SystemExit('ERROR: generated catalogue has zero channels')
          if d.get('count') != len(channels):
              raise SystemExit('ERROR: catalogue count mismatch')
          if int(d.get('healthyUrls',0)) <= 0:
              raise SystemExit('ERROR: generated catalogue has zero healthy URLs')
          print(f'GENERATED CATALOG OK: {len(channels)} channels / {d.get("healthyUrls")} healthy URLs / {p.stat().st_size} bytes')
          PY

      - name: Upload generated catalogue artifact
        uses: actions/upload-artifact@v4
        with:
          name: bouyontv-catalog-${{ github.run_id }}
          path: data/catalog.json
          retention-days: 7

      - name: Commit catalogue with verified file
        run: |
          set -euo pipefail
          git config user.name 'bouyontv-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json
          git diff --cached --quiet || git commit -m 'chore: refresh BouyonTV validated catalogue'
          git push origin HEAD:main

      - name: Verify repository file after push
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          test -s "$CATALOG"
          python - <<'PY'
          import json
          d=json.load(open('data/catalog.json',encoding='utf-8'))
          if not d.get('channels') or d.get('count',0) != len(d['channels']):
              raise SystemExit('ERROR: repository catalogue verification failed')
          print(f'REPOSITORY CATALOG OK: {d["count"]} channels / {d.get("healthyUrls",0)} healthy URLs')
          PY
