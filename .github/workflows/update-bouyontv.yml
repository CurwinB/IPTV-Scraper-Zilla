name: Update BouyonTV catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BouyonTV
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --upgrade requests

      - name: Build validated catalogue
        run: python scripts/build_catalog.py

      - name: Commit catalogue
        run: |
          git config user.name 'bouyontv-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json
          git diff --cached --quiet || git commit -m 'chore: refresh BouyonTV validated catalogue'
          git push
