name: Update BouyonTV catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install IPTV API
        run: |
          python -m pip install --upgrade pip
          python -m pip install iptv-api

      - name: Generate validated playlist
        run: |
          mkdir -p data
          python -m iptv_api --help || true
          if command -v iptv-api >/dev/null 2>&1; then
            iptv-api --help || true
          fi

      - name: Build BouyonTV catalogue from validated outputs
        run: python scripts/build_catalog.py

      - name: Commit catalogue
        run: |
          git config user.name 'bouyontv-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json
          git diff --cached --quiet || git commit -m 'chore: update BouyonTV validated catalogue'
          git push
