name: Integrate BouyonTV VOD UI

on:
  push:
    branches: [main]
    paths:
      - 'vod-ui.js'
      - 'api/vod.js'
      - 'scripts/integrate_vod_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inject VOD UI
        run: python scripts/integrate_vod_ui.py

      - name: Commit integration
        run: |
          git config user.name 'bouyontv-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No integration change needed'
          else
            git commit -m 'feat: integrate Movies and TV Shows into BouyonTV'
            git push origin HEAD:main
          fi
