<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Zilla IPTV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}.app{height:100dvh;display:grid;grid-template-columns:340px minmax(0,1fr)}aside{min-height:0;background:#090909;border-right:1px solid #242424;display:flex;flex-direction:column}header{padding:16px;border-bottom:1px solid #242424}.brand{font-size:20px;font-weight:800;margin-bottom:12px}.search,select{width:100%;background:#151515;color:#eee;border:1px solid #292929;border-radius:9px;padding:10px;outline:0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.filters select:last-child{grid-column:1/-1}.count{font-size:11px;color:#888;margin-top:9px}.list{flex:1;min-height:0;overflow:auto;padding:7px}.channel{width:100%;display:flex;gap:10px;align-items:center;padding:9px;border:0;border-radius:8px;background:transparent;color:#eee;text-align:left;cursor:pointer}.channel:hover,.channel.active{background:#191919}.logo{width:42px;height:30px;object-fit:contain;flex:0 0 42px;background:#111;border-radius:4px}.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{padding:13px 18px;border-bottom:1px solid #242424;display:flex;justify-content:space-between;gap:15px;align-items:center}.title{min-width:0}.title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:#888;margin-top:3px}.video{position:relative;min-height:0;background:#000;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain}.empty{position:absolute;color:#666}.error{color:#ff8585}.more{padding:9px;margin:0 7px 7px;background:#151515;color:#aaa;border:1px solid #292929;border-radius:8px}.more[hidden]{display:none}@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:58dvh 42dvh}aside{order:2;border-right:0;border-top:1px solid #242424}main{order:1}.bar{padding:9px 12px}.filters{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><aside><header><div class="brand">Zilla IPTV</div><input id="search" class="search" placeholder="Search channels…"><div class="filters"><select id="country"><option value="">All countries</option></select><select id="language"><option value="">All languages</option></select><select id="category"><option value="">All categories</option></select></div><div id="count" class="count">Loading catalogue…</div></header><div id="list" class="list"></div><button id="more" class="more" hidden>Load more</button></aside><main><div class="bar"><div class="title"><strong id="title">Select a channel</strong><div id="status" class="status">Loading Zilla catalogue</div></div><button id="full">Fullscreen</button></div><div class="video"><video id="video" controls playsinline></video><div id="empty" class="empty">Choose a channel to watch.</div></div></main></div><script>
const $=id=>document.getElementById(id),state={all:[],filtered:[],visible:80,active:null,hls:null};const video=$('video');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function norm(s){return String(s||'').trim()}function vals(key){return [...new Set(state.all.map(x=>norm(x[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}function fill(id,label,values){$(id).innerHTML=`<option value="">${label}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function render(){const q=$('search').value.toLowerCase().trim(),co=$('country').value,la=$('language').value,ca=$('category').value;state.filtered=state.all.filter(c=>(!q||`${c.name} ${c.id}`.toLowerCase().includes(q))&&(!co||c.country===co)&&(!la||c.language===la)&&(!ca||c.group===ca));state.visible=80;$('count').textContent=`${state.filtered.length.toLocaleString()} channels`;draw(true)}function draw(reset){if(reset)$('list').replaceChildren();const start=reset?0:state.visible-80,end=Math.min(state.visible,state.filtered.length),frag=document.createDocumentFragment();for(let i=start;i<end;i++){const c=state.filtered[i],b=document.createElement('button');b.className='channel'+(c.url===state.active?' active':'');b.dataset.index=i;b.innerHTML=`<img class="logo" loading="lazy" src="${esc(c.logo)}" onerror="this.style.visibility='hidden'"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.group||c.language||c.country||c.source||'Live')}</div></div>`;frag.appendChild(b)}$('list').appendChild(frag);$('more').hidden=end>=state.filtered.length}
function status(t,error=false){$('status').textContent=t;$('status').className='status'+(error?' error':'')}function play(c){state.active=c.url;$('empty').style.display='none';$('title').textContent=c.name;status('Connecting…');document.querySelectorAll('.channel.active').forEach(x=>x.classList.remove('active'));const btn=[...document.querySelectorAll('.channel')].find(x=>state.filtered[Number(x.dataset.index)]?.url===c.url);if(btn)btn.classList.add('active');if(state.hls){state.hls.destroy();state.hls=null}video.pause();video.removeAttribute('src');video.load();const src=`/api/stream?url=${encodeURIComponent(c.url)}`;if(Hls.isSupported()){state.hls=new Hls({enableWorker:true,backBufferLength:30});state.hls.loadSource(src);state.hls.attachMedia(video);state.hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().then(()=>status('Playing')).catch(()=>status('Press play to start')));state.hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)status('Stream unavailable',true)});return}video.src=src;video.play().then(()=>status('Playing')).catch(()=>status('Press play to start'))}
async function init(){try{const r=await fetch('/api/catalog',{cache:'no-store'});if(!r.ok)throw Error(`Catalogue HTTP ${r.status}`);const data=await r.json();state.all=data.channels||[];fill('country','All countries',vals('country'));fill('language','All languages',vals('language'));fill('category','All categories',vals('group'));render();status(`${state.all.length.toLocaleString()} streams indexed`)}catch(e){status('Could not load Zilla catalogue',true);$('count').textContent='Catalogue unavailable';console.error(e)}}
let timer;['search','country','language','category'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{clearTimeout(timer);timer=setTimeout(render,id==='search'?150:0)}));$('more').onclick=()=>{state.visible+=80;draw(false)};$('list').addEventListener('click',e=>{const b=e.target.closest('.channel');if(!b)return;const c=state.filtered[Number(b.dataset.index)];if(c)play(c)});$('full').onclick=()=>document.querySelector('.video').requestFullscreen?.();init();
</script></body></html>
