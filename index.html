<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>BouyonTV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#f5f5f5;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{height:100dvh;min-height:100svh;display:grid;grid-template-columns:340px minmax(0,1fr)}aside{min-height:0;background:#090909;border-right:1px solid #242424;display:flex;flex-direction:column}header{padding:16px;padding-top:max(16px,env(safe-area-inset-top));border-bottom:1px solid #242424}.brand{font-size:21px;font-weight:850;letter-spacing:-.03em;margin-bottom:13px}.search,select{width:100%;background:#151515;color:#eee;border:1px solid #292929;border-radius:9px;padding:10px 11px;outline:0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.filters select:last-child{grid-column:1/-1}.count{font-size:11px;color:#888;margin-top:9px}.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:7px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.channel{width:100%;display:flex;gap:10px;align-items:center;padding:10px;border:0;border-radius:8px;background:transparent;color:#eee;text-align:left;cursor:pointer;min-height:52px}.channel:hover,.channel.active{background:#191919}.channel:active{background:#222}.logo{width:42px;height:30px;object-fit:contain;flex:0 0 42px;background:#111;border-radius:4px}.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{min-height:59px;padding:11px 18px;border-bottom:1px solid #242424;display:flex;justify-content:space-between;gap:15px;align-items:center}.title{min-width:0}.title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:#888;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.error{color:#ff8585}.bar button{background:#151515;color:#ddd;border:1px solid #292929;border-radius:8px;padding:8px 11px;white-space:nowrap}.video{position:relative;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}video{display:block;width:100%;height:100%;object-fit:contain;background:#000}.empty{position:absolute;color:#666;pointer-events:none;text-align:center;padding:20px}.more{padding:10px;margin:0 7px 7px;background:#151515;color:#aaa;border:1px solid #292929;border-radius:8px;min-height:40px}.more[hidden]{display:none}@media(max-width:800px){.app{height:100dvh;grid-template-columns:1fr;grid-template-rows:minmax(0,58dvh) minmax(0,42dvh)}aside{order:2;border-right:0;border-top:1px solid #242424;min-height:0}main{order:1;min-height:0}.bar{min-height:52px;padding:8px 10px}.title strong{font-size:14px}.status{font-size:10px}.bar button{padding:7px 9px}.list{padding:5px}.channel{padding:8px;min-height:48px}.logo{width:38px;height:28px;flex-basis:38px}header{padding:10px;padding-bottom:9px}.brand{font-size:18px;margin-bottom:9px}.search,select{padding:8px 9px}.filters{margin-top:6px}.count{margin-top:6px}}@media(max-width:480px){.app{grid-template-rows:minmax(0,55dvh) minmax(0,45dvh)}.filters select{font-size:12px}.count{font-size:10px}.bar{gap:8px}.empty{font-size:12px}}@media(orientation:landscape) and (max-width:800px){.app{grid-template-columns:minmax(210px,30vw) minmax(0,1fr);grid-template-rows:1fr}.app aside{order:1;border-top:0;border-right:1px solid #242424}.app main{order:2}.bar{min-height:48px}}
</style></head><body><div class="app"><aside><header><div class="brand">BouyonTV</div><input id="search" class="search" placeholder="Search channels…" autocomplete="off" inputmode="search"><div class="filters"><select id="country"><option value="">All countries</option></select><select id="language"><option value="">All languages</option></select><select id="category"><option value="">All categories</option></select></div><div id="count" class="count">Loading catalogue…</div></header><div id="list" class="list"></div><button id="more" class="more" hidden>Load more</button></aside><main><div class="bar"><div class="title"><strong id="title">Select a channel</strong><div id="status" class="status">Loading BouyonTV catalogue</div></div><button id="full" type="button">Fullscreen</button></div><div class="video"><video id="video" controls playsinline webkit-playsinline preload="metadata"></video><div id="empty" class="empty">Choose a channel to watch.</div></div></main></div><script>
const $=id=>document.getElementById(id),state={all:[],filtered:[],visible:80,active:null,sources:[],sourceIndex:0,hls:null};const video=$('video');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function norm(s){return String(s||'').trim()}function vals(key){return [...new Set(state.all.map(x=>norm(x[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}function fill(id,label,values){$(id).innerHTML=`<option value="">${label}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function render(){const q=$('search').value.toLowerCase().trim(),co=$('country').value,la=$('language').value,ca=$('category').value;state.filtered=state.all.filter(c=>(!q||`${c.name} ${c.id}`.toLowerCase().includes(q))&&(!co||c.country===co)&&(!la||c.language===la)&&(!ca||c.group===ca));state.visible=80;$('count').textContent=`${state.filtered.length.toLocaleString()} verified channels`;draw(true)}function draw(reset){if(reset)$('list').replaceChildren();const start=reset?0:state.visible-80,end=Math.min(state.visible,state.filtered.length),frag=document.createDocumentFragment();for(let i=start;i<end;i++){const c=state.filtered[i],b=document.createElement('button');b.className='channel'+(c.url===state.active?' active':'');b.dataset.index=i;const n=c.sources?.length||1;b.innerHTML=`<img class="logo" loading="lazy" src="${esc(c.logo)}" onerror="this.style.visibility='hidden'"><div style="min-width:0;flex:1"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.group||c.language||c.country||'Live')} ${n>1?'• '+n+' verified sources':''}</div></div>`;frag.appendChild(b)}$('list').appendChild(frag);$('more').hidden=end>=state.filtered.length}
function status(t,error=false){$('status').textContent=t;$('status').className='status'+(error?' error':'')}function destroy(){if(state.hls){state.hls.destroy();state.hls=null}video.pause();video.removeAttribute('src');video.load()}
async function verify(url){try{const r=await fetch(`/api/verify?url=${encodeURIComponent(url)}`,{cache:'no-store'});if(!r.ok)return null;return await r.json()}catch{return null}}
async function play(c){destroy();state.active=c.url;state.sources=(c.sources||[]).map(s=>typeof s==='string'?s:s.url).filter(Boolean);if(c.url&&!state.sources.includes(c.url))state.sources.unshift(c.url);state.sourceIndex=0;$('empty').style.display='none';$('title').textContent=c.name;document.querySelectorAll('.channel.active').forEach(x=>x.classList.remove('active'));const btn=[...document.querySelectorAll('.channel')].find(x=>state.filtered[Number(x.dataset.index)]?.url===c.url);if(btn)btn.classList.add('active');await trySource()}
async function trySource(){if(state.sourceIndex>=state.sources.length){status('No source is playable through BouyonTV',true);return}const original=state.sources[state.sourceIndex++];status(`Verifying source ${state.sourceIndex}/${state.sources.length}…`);const check=await verify(original);if(!check?.ok){setTimeout(trySource,80);return}const src=`/api/stream?url=${encodeURIComponent(original)}`;status(`Playing verified source (${check.latency}ms)`);if(Hls.isSupported()){state.hls=new Hls({enableWorker:true,backBufferLength:20,maxBufferLength:20});state.hls.attachMedia(video);state.hls.on(Hls.Events.MEDIA_ATTACHED,()=>state.hls.loadSource(src));state.hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().then(()=>status('Playing')).catch(()=>status('Press play to start')));state.hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;if(state.hls){state.hls.destroy();state.hls=null}setTimeout(trySource,80)});return}if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=src;video.play().then(()=>status('Playing')).catch(()=>setTimeout(trySource,80))}else status('HLS is not supported in this browser',true)}
async function init(){try{const r=await fetch('/api/catalog',{cache:'no-store'});if(!r.ok)throw Error(`Catalogue HTTP ${r.status}`);const data=await r.json();state.all=data.channels||[];fill('country','All countries',vals('country'));fill('language','All languages',vals('language'));fill('category','All categories',vals('group'));render();status(`${state.all.length.toLocaleString()} verified channels indexed`)}catch(e){status('Verified catalogue unavailable',true);$('count').textContent='Run the catalogue workflow first';console.error(e)}}
let timer;['search','country','language','category'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{clearTimeout(timer);timer=setTimeout(render,id==='search'?150:0)}));$('more').onclick=()=>{state.visible+=80;draw(false)};$('list').addEventListener('click',e=>{const b=e.target.closest('.channel');if(!b)return;const c=state.filtered[Number(b.dataset.index)];if(c)play(c)});$('full').onclick=async()=>{const v=document.querySelector('.video');try{if(document.fullscreenElement)await document.exitFullscreen();else if(v.requestFullscreen)await v.requestFullscreen();else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen()}catch(e){console.warn(e)}};video.addEventListener('error',()=>{if(state.sourceIndex<state.sources.length)setTimeout(trySource,80)});init();
</script></body></html>
