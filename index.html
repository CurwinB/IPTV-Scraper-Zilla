<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>BouyonTV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#f5f5f5;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}button,input,select{font:inherit}.app{height:100dvh;display:grid;grid-template-columns:340px minmax(0,1fr)}aside{background:#090909;border-right:1px solid #242424;display:flex;flex-direction:column;min-height:0}header{padding:15px;border-bottom:1px solid #242424}.brand{font-size:22px;font-weight:850;letter-spacing:-.04em;margin-bottom:12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:9px}.tab,select,.search{background:#151515;color:#ddd;border:1px solid #292929;border-radius:8px}.tab{padding:8px 5px;cursor:pointer;font-size:12px}.tab.active{background:#f5f5f5;color:#050505;border-color:#f5f5f5}.search,select{width:100%;padding:9px 10px;outline:0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.filters select:last-child{grid-column:1/-1}.count{font-size:11px;color:#777;margin-top:8px}.list{flex:1;min-height:0;overflow:auto;padding:7px;-webkit-overflow-scrolling:touch}.item{width:100%;display:flex;gap:10px;align-items:center;padding:9px;border:0;border-radius:8px;background:transparent;color:#eee;text-align:left;cursor:pointer;min-height:54px}.item:hover,.item.active{background:#191919}.poster,.logo{width:42px;height:52px;object-fit:cover;flex:0 0 42px;background:#111;border-radius:4px}.logo{height:30px;object-fit:contain}.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#777;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{margin:0 7px 7px;padding:10px;background:#151515;color:#aaa;border:1px solid #292929;border-radius:8px}.more[hidden]{display:none}main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{min-height:59px;padding:10px 17px;border-bottom:1px solid #242424;display:flex;justify-content:space-between;align-items:center;gap:12px}.title{min-width:0}.title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:#888;margin-top:3px}.error{color:#ff8585}.bar button{background:#151515;color:#ddd;border:1px solid #292929;border-radius:8px;padding:8px 10px}.video{position:relative;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}video{width:100%;height:100%;object-fit:contain;background:#000}.empty{position:absolute;color:#666;text-align:center;padding:20px;pointer-events:none}.vodPlayer{position:absolute;inset:0;background:#000;display:none}.vodPlayer iframe{width:100%;height:100%;border:0}.details{position:absolute;left:16px;right:16px;bottom:16px;max-width:650px;background:rgba(0,0,0,.78);padding:14px;border:1px solid #292929;border-radius:10px;backdrop-filter:blur(10px)}.details h2{margin:0 0 5px;font-size:18px}.details p{margin:0;color:#bbb;font-size:12px;line-height:1.5}.episodes{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.episode{padding:6px 8px;background:#171717;border:1px solid #303030;color:#ddd;border-radius:6px;cursor:pointer;font-size:11px}.episode.active{background:#eee;color:#050505}@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,58dvh) minmax(0,42dvh)}aside{order:2;border-right:0;border-top:1px solid #242424}main{order:1}.bar{min-height:52px;padding:8px 10px}header{padding:10px}.brand{font-size:19px;margin-bottom:8px}.tab{font-size:11px}.list{padding:5px}.item{min-height:48px;padding:8px}.poster{width:36px;height:48px;flex-basis:36px}.logo{width:38px;flex-basis:38px}}@media(max-width:480px){.app{grid-template-rows:minmax(0,55dvh) minmax(0,45dvh)}.filters select{font-size:12px}.details{left:8px;right:8px;bottom:8px}.details h2{font-size:15px}}@media(orientation:landscape) and (max-width:800px){.app{grid-template-columns:minmax(210px,30vw) minmax(0,1fr);grid-template-rows:1fr}.app aside{order:1;border-top:0;border-right:1px solid #242424}.app main{order:2}}</style></head><body><div class="app"><aside><header><div class="brand">BouyonTV</div><div class="tabs"><button class="tab active" data-mode="live">Live TV</button><button class="tab" data-mode="movie">Movies</button><button class="tab" data-mode="tv">TV Shows</button></div><input id="search" class="search" placeholder="Search channels…" autocomplete="off" inputmode="search"><div id="filters" class="filters"><select id="country"><option value="">All countries</option></select><select id="language"><option value="">All languages</option></select><select id="category"><option value="">All categories</option></select></div><div id="count" class="count">Loading catalogue…</div></header><div id="list" class="list"></div><button id="more" class="more" hidden>Load more</button></aside><main><div class="bar"><div class="title"><strong id="title">BouyonTV</strong><div id="status" class="status">Select something to watch</div></div><button id="full">Fullscreen</button></div><div class="video"><video id="video" controls playsinline webkit-playsinline preload="metadata"></video><div id="vodPlayer" class="vodPlayer"><iframe id="frame" allowfullscreen allow="autoplay; encrypted-media"></iframe></div><div id="empty" class="empty">Choose a channel, movie, or show.</div><div id="details" class="details" hidden></div></div></main></div><script>
const $=id=>document.getElementById(id),state={mode:'live',channels:[],items:[],visible:60,filtered:[],sources:[],si:0,hls:null,tmdb:null,season:1,episode:1};const video=$('video'),IMG='https://image.tmdb.org/t/p/w342';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function status(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' error':'')}function fill(id,label,vals){$(id).innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
async function tmdb(type,id='',season=''){const u=`/api/tmdb?type=${encodeURIComponent(type)}${id?'&id='+encodeURIComponent(id):''}${season?'&season='+encodeURIComponent(season):''}`;const r=await fetch(u,{cache:'no-store'});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'TMDB request failed')}return r.json()}
function hideDetails(){$('details').hidden=true;$('details').innerHTML=''}function clearPlayer(){if(state.hls){state.hls.destroy();state.hls=null}video.pause();video.removeAttribute('src');video.load();$('vodPlayer').style.display='none';$('frame').src='';video.style.display='block';hideDetails()}
function liveFilters(){const vals=k=>[...new Set(state.channels.map(c=>String(c[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));fill('country','All countries',vals('country'));fill('language','All languages',vals('language'));fill('category','All categories',vals('category'));$('filters').style.display='grid'}
function render(){const q=$('search').value.toLowerCase().trim();if(state.mode==='live'){const co=$('country').value,la=$('language').value,ca=$('category').value;state.filtered=state.channels.filter(c=>(!q||`${c.name} ${c.id}`.toLowerCase().includes(q))&&(!co||c.country===co)&&(!la||c.language===la)&&(!ca||c.category===ca||c.group===ca));$('count').textContent=`${state.filtered.length.toLocaleString()} verified channels`}else{state.filtered=state.items.filter(x=>(x.media_type==='movie'||x.media_type==='tv')&&(!q||`${x.title||x.name} ${x.overview||''}`.toLowerCase().includes(q)));$('count').textContent=`${state.filtered.length.toLocaleString()} results`}state.visible=60;draw(true)}
function draw(reset){if(reset)$('list').replaceChildren();const start=reset?0:state.visible-60,end=Math.min(state.visible,state.filtered.length),frag=document.createDocumentFragment();for(let i=start;i<end;i++){const x=state.filtered[i],b=document.createElement('button');b.className='item';b.dataset.i=i;if(state.mode==='live'){b.innerHTML=`<img class="logo" loading="lazy" src="${esc(x.logo)}" onerror="this.style.visibility='hidden'"><div style="min-width:0"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.category||x.group||'General')} • ${esc(x.language||x.country||'Unknown')}</div></div>`}else{const title=x.title||x.name||'Untitled',year=(x.release_date||x.first_air_date||'').slice(0,4);b.innerHTML=`<img class="poster" loading="lazy" src="${x.poster_path?IMG+x.poster_path:''}" onerror="this.style.visibility='hidden'"><div style="min-width:0"><div class="name">${esc(title)}</div><div class="meta">${esc(year)} • ${x.media_type==='tv'?'TV Show':'Movie'}</div></div>`}frag.appendChild(b)}$('list').appendChild(frag);$('more').hidden=end>=state.filtered.length}
async function playLive(c){clearPlayer();state.sources=(c.sources||[]).map(s=>typeof s==='string'?s:s.url).filter(Boolean);if(c.url&&!state.sources.includes(c.url))state.sources.unshift(c.url);state.si=0;$('empty').style.display='none';$('title').textContent=c.name;await trySource()}
async function verify(url){try{const r=await fetch(`/api/verify?url=${encodeURIComponent(url)}`,{cache:'no-store'});if(!r.ok)return null;return r.json()}catch{return null}}
async function trySource(){if(state.si>=state.sources.length){status('No source is playable through BouyonTV',true);return}const original=state.sources[state.si++];status(`Verifying source ${state.si}/${state.sources.length}…`);const c=await verify(original);if(!c?.ok)return setTimeout(trySource,60);const src=`/api/stream?url=${encodeURIComponent(original)}`;if(Hls.isSupported()){state.hls=new Hls({enableWorker:true,backBufferLength:20,maxBufferLength:20});state.hls.attachMedia(video);state.hls.on(Hls.Events.MEDIA_ATTACHED,()=>state.hls.loadSource(src));state.hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().then(()=>status('Playing')).catch(()=>status('Press play to start')));state.hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;state.hls.destroy();state.hls=null;setTimeout(trySource,60)});return}if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=src;video.play().catch(()=>{});status('Playing')}else status('HLS is not supported in this browser',true)}
function cineUrl(type,id,s,e){return type==='tv'?`https://cinextream.net/api/embed/tv/${id}/${s}/${e}`:`https://cinextream.net/api/embed/movie/${id}`}
function showDetails(x,episodes=[]){const title=x.title||x.name,year=(x.release_date||x.first_air_date||'').slice(0,4);$('details').hidden=false;$('details').innerHTML=`<h2>${esc(title)}${year?' ('+esc(year)+')':''}</h2><p>${esc(x.overview||'')}</p>${episodes.length?'<div class="episodes">'+episodes.map(e=>`<button class="episode${e.episode_number===state.episode?' active':''}" data-ep="${e.episode_number}">E${e.episode_number}</button>`).join('')+'</div>':''}`}
async function playVod(x){clearPlayer();state.tmdb=x.id;state.season=1;state.episode=1;$('empty').style.display='none';$('video').style.display='none';$('vodPlayer').style.display='block';$('frame').src=cineUrl(x.media_type,x.id,1,1);$('title').textContent=x.title||x.name;status('Loading CineXtream player…');if(x.media_type==='tv'){try{const s=await tmdb('season',x.id,1);showDetails(x,s.episodes||[])}catch{showDetails(x)}}else showDetails(x)}
async function loadMode(){clearPlayer();$('search').value='';if(state.mode==='live'){state.items=[];$('filters').style.display='grid';liveFilters();render();status(`${state.channels.length.toLocaleString()} verified channels indexed`);return}$('filters').style.display='none';status('Loading catalogue…');try{const data=await tmdb(state.mode==='movie'?'popular-movies':'popular-tv');state.items=(data.results||[]).map(x=>({...x,media_type:state.mode}));render();status(`${state.items.length} ${state.mode==='movie'?'movies':'TV shows'} loaded`)}catch(e){$('count').textContent='TMDB unavailable';status(e.message,true);state.items=[];draw(true)}}
$('list').onclick=e=>{const b=e.target.closest('.item');if(!b)return;const x=state.filtered[Number(b.dataset.i)];if(x)state.mode==='live'?playLive(x):playVod(x)};$('more').onclick=()=>{state.visible+=60;draw(false)};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.mode=b.dataset.mode;loadMode()});['country','language','category'].forEach(id=>$(id).onchange=render);$('search').oninput=()=>{clearTimeout(window.q);window.q=setTimeout(render,160)};$('full').onclick=async()=>{const el=document.querySelector('.video');try{if(document.fullscreenElement)await document.exitFullscreen();else await el.requestFullscreen()}catch{}};$('details').onclick=async e=>{const b=e.target.closest('.episode');if(!b)return;state.episode=Number(b.dataset.ep);$('frame').src=cineUrl('tv',state.tmdb,state.season,state.episode);document.querySelectorAll('.episode').forEach(x=>x.classList.remove('active'));b.classList.add('active');status(`Playing Season ${state.season}, Episode ${state.episode}`)};window.addEventListener('message',e=>{let d=e.data;try{if(typeof d==='string')d=JSON.parse(d)}catch{return}if(!d||!d.event)return;if(d.event==='player_ready')status('Player ready');if(d.event==='player_error')status(`CineXtream error: ${d.reason||'stream error'}`,true);if(d.event==='VIDEO_ENDED'&&state.tmdb){const next=Number(d.episode||state.episode)+1;state.episode=next;$('frame').src=cineUrl('tv',state.tmdb,Number(d.season||state.season),next);status(`Next episode: S${d.season||state.season}E${next}`)}});video.addEventListener('error',()=>{if(state.si<state.sources.length)trySource()});
(async function init(){try{const r=await fetch('/api/catalog',{cache:'no-store'});if(!r.ok)throw Error('Verified live catalogue unavailable');const d=await r.json();state.channels=d.channels||[];liveFilters();render();status(`${state.channels.length.toLocaleString()} verified channels indexed`)}catch(e){$('count').textContent='Live catalogue unavailable';status(e.message,true)}})();</script></body></html>
